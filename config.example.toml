[general]
output_dir = "~/Music/Harvested"
log_level_file = "DEBUG"
log_level_ui = "INFO"
first_run_notice_accepted = false

[slskd]
enabled = true
url = "http://localhost:5000"
api_key_env = "SLSKD_API_KEY"
download_dir = "~/Music/slskd"
search_timeout_s = 25
poll_interval_s = 1.5
max_concurrent_downloads = 2
verify_openapi = true
# best_available | lossless_preferred | fast_fallback | highest_quality_mp3
acquisition_mode = "best_available"
max_queue_length = 5
p2p_timeout_s = 30

[acoustid]
# Key value read from this env var (or a .env file next to the config / OMNIRIP_ENV_FILE).
api_key_env = "ACOUSTID_API_KEY"
rate_limit_per_s = 3
cache_ttl_days = 90

[jev]
# TypeSafe Jev advisory triage of P2P candidates (optional, off by default).
# Jev reads filenames only — it never hears audio, never touches the spectral
# verdict, and never replaces the deterministic candidate scoring (docs/06 §7-§8).
# When enabled, candidates it clearly judges mismatched or counterfeit-like are
# moved down the queue; everything else keeps its deterministic order.
# Needs TYPESAFE_API_KEY in the environment (or a local .env).
enabled = false
api_key_env = "TYPESAFE_API_KEY"
model = "jev-latest"
# How many ranked candidates to judge per search (2 questions each, one request).
max_candidates = 8

[restoration]
enabled = false
mode = "conservative"
preserve_original = true

[processing]
# Which stages run for a track (docs/13). Orthogonal to slskd.acquisition_mode
# (which file we get) — this decides what we do with it.
#   fetch_only  = acquire + tag only. No separation, no lanes, no restoration (~0.2 GB).
#   standard    = 4-source separation + song-driven lanes (default, ~1.7 GB).
#   neural_full = adds guitar/piano extras, MusicBrainz credits and tagging (~2.5 GB).
# The separator may still fall back internally (neural -> hdemucs -> eco); a run that
# lands on the eco 2-layer fallback is reported loudly, never applied silently.
preset = "standard"
# Annotate lanes with documented instruments/vocal parts + singer count (MusicBrainz).
use_credits = true
# CLAP tag threshold: the mean share of the label mass a tag needs to be reported.
# The share is the softmax mass across 12 instrument/vocal prompts (relative, not a
# calibrated probability); an even spread is ~8 %, so 0.15 ≈ "twice the even share".
# Raise it for fewer, safer tags. Only used by presets with tags = true.
tag_threshold = 0.15
# Hosted separation (MVSEP, docs/13 D26). Opt-in PER TRACK: nothing here runs from a
# preset, a job or startup — the Hosted engine choice on the REPAIR page is the only
# trigger, because it is the only path that uploads audio off this machine.
# Needs MVSEP_API_KEY in the environment (or a local .env). Names come from SEP_TYPES:
#   karaoke_lead_back = MVSep Karaoke (lead/back vocals, 4 stems, cheap — the default)
#   mega_53_stem      = Mega 53-stem model (richest, slowest, most credits)
#   bs_roformer_sw / demucs4_ht / ensemble_all_in also exist; a raw numeric id works too.
hosted_sep_type = "karaoke_lead_back"
# Seconds to upload (0 = whole track). The queue is shared, so a short excerpt is often
# the honest choice while auditioning; hosted runs cost account credits.
hosted_max_seconds = 0.0
# Speaker measurement (pyannote, docs/13 D27) — advisory only, never overwrites the
# MusicBrainz credit count. Needs the optional extra: uv pip install -e '.[diarize]'.
# Seconds to measure (0 = whole track). Runs on CPU by design (Apple MPS fails here).
diarize_max_seconds = 0.0
# Genre intent colouring (docs/01 D38). auto = suggest from the file's tags and, when
# the track has a MusicBrainz id, from MusicBrainz genres; neutral = no colour; a profile
# key (hip_hop_trap, house, jazz, ...) pins one; mix opens the manual mix picker.
# The genre curve is a small, test-capped mastering layer applied to the enhanced master.
genre = "auto"
# subtle | balanced | bold — scales the genre curve (subtle is the default).
genre_intensity = "subtle"

[ytdlp]
binary = "yt-dlp"
format = "bestaudio[acodec^=opus]/bestaudio/best"
cookies_from_browser = ""
stall_timeout_s = 90
total_timeout_s = 900

[ffmpeg]
binary = "ffmpeg"
probe_binary = "ffprobe"
transcode = "mp3-320"

[spectral]
enabled = true
excerpt_s = 60
strict = false

[batch]
skip_bitrate_kbps = 256
playlist_cap = 50
rename_to_canonical = false
trash_retention_days = 7
auto_purge_trash = false

[timeouts]
probe_s = 30
fpcalc_s = 60
acoustid_s = 15
coverart_s = 15
transcode_s = 300
ffprobe_s = 15
spectral_s = 30
health_s = 5
kill_grace_s = 5
jev_s = 15

[ui]
refresh_hz = 8
max_log_lines = 2000
status_interval_s = 10
# PLAYER terminal render fidelity. "auto" detects safely: sextant blocks by
# default, dropping to ascii when Unicode or color are unavailable. Force a
# mode with: ascii | braille | halfblock | quadrant | sextant | octant.
# Octants (Unicode 16) are opt-in because font coverage varies.
visual_fidelity = "auto"
# Reduce decorative motion in PLAYER: companion scene freezes, blink/marquee
# and scanline effects stop, and portraits render statically.
reduced_motion = false

[obsidian]
# Optional: treat a local Obsidian vault as the second brain / database (docs/15).
# Opt-in — nothing is read or written until this is enabled. Folders default to the
# standard layout and can stay unset.
enabled = false
vault_dir = "~/OmniRip-Vault"
# library = "Library"
# sessions = "Sessions"
# studio = "Studio"
# wants = "Wants"
