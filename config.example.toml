[general]
output_dir = "~/Music/Harvested"
log_level_file = "DEBUG"
log_level_ui = "INFO"
first_run_notice_accepted = false

[slskd]
enabled = true
url = "http://localhost:5000"
api_key_env = "SLSKD_API_KEY"
download_dir = "~/Music/slskd"
search_timeout_s = 25
poll_interval_s = 1.5
max_concurrent_downloads = 2
verify_openapi = true
# best_available | lossless_preferred | fast_fallback | highest_quality_mp3
acquisition_mode = "best_available"
max_queue_length = 5
p2p_timeout_s = 30

[acoustid]
# Key value read from this env var (or a .env file next to the config / OMNIRIP_ENV_FILE).
api_key_env = "ACOUSTID_API_KEY"
rate_limit_per_s = 3
cache_ttl_days = 90

[restoration]
enabled = false
mode = "conservative"
preserve_original = true

[processing]
# Which stages run for a track (docs/13). Orthogonal to slskd.acquisition_mode
# (which file we get) — this decides what we do with it.
#   fetch_only  = acquire + tag only. No separation, no lanes, no restoration (~0.2 GB).
#   standard    = 4-source separation + song-driven lanes (default, ~1.7 GB).
#   neural_full = adds guitar/piano extras, MusicBrainz credits and tagging (~2.5 GB).
# The separator may still fall back internally (neural -> hdemucs -> eco); a run that
# lands on the eco 2-layer fallback is reported loudly, never applied silently.
preset = "standard"
# Annotate lanes with documented instruments/vocal parts + singer count (MusicBrainz).
use_credits = true
# CLAP tag threshold: the mean share of the label mass a tag needs to be reported.
# The share is the softmax mass across 12 instrument/vocal prompts (relative, not a
# calibrated probability); an even spread is ~8 %, so 0.15 ≈ "twice the even share".
# Raise it for fewer, safer tags. Only used by presets with tags = true.
tag_threshold = 0.15

[ytdlp]
binary = "yt-dlp"
format = "bestaudio[acodec^=opus]/bestaudio/best"
cookies_from_browser = ""
stall_timeout_s = 90
total_timeout_s = 900

[ffmpeg]
binary = "ffmpeg"
probe_binary = "ffprobe"
transcode = "mp3-320"

[spectral]
enabled = true
excerpt_s = 60
strict = false

[batch]
skip_bitrate_kbps = 256
playlist_cap = 50
rename_to_canonical = false
trash_retention_days = 7
auto_purge_trash = false

[timeouts]
probe_s = 30
fpcalc_s = 60
acoustid_s = 15
coverart_s = 15
transcode_s = 300
ffprobe_s = 15
spectral_s = 30
health_s = 5
kill_grace_s = 5

[ui]
refresh_hz = 8
max_log_lines = 2000
status_interval_s = 10
