name: Release Standalone Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: omnirip-macos-arm64.tar.gz
            use_zip: false
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: omnirip-macos-x86_64.tar.gz
            use_zip: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: omnirip-windows-x64.zip
            use_zip: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: omnirip-linux-x86_64.tar.gz
            use_zip: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ALSA dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifacts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          make -C drivers/omnirip_hal
          mkdir -p dist/bundle
          cp "target/${{ matrix.target }}/release/omnirip" dist/bundle/
          cp -R drivers/omnirip_hal/OmniRipAudio.driver dist/bundle/
          cp scripts/install.sh dist/bundle/
          cp scripts/install.command dist/bundle/
          cp README.md dist/bundle/
          tar -czf "dist/${{ matrix.artifact_name }}" -C dist/bundle .

      - name: Package artifacts (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/bundle
          cp "target/${{ matrix.target }}/release/omnirip" dist/bundle/
          cp scripts/install.sh dist/bundle/
          cp README.md dist/bundle/
          tar -czf "dist/${{ matrix.artifact_name }}" -C dist/bundle .

      - name: Package artifacts (Windows)
        if: matrix.use_zip == true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Compress-Archive -Path "target/${{ matrix.target }}/release/omnirip.exe", "scripts/install.ps1", "README.md" -DestinationPath "dist/${{ matrix.artifact_name }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  publish-github-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts

      - name: Create GitHub Release with Standalone Executables
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
