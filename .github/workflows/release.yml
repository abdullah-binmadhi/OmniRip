name: Release Standalone Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Standalone (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-14
            artifact_name: omnirip-macos-arm64
            binary_name: dist/omnirip
          - os: ubuntu-latest
            artifact_name: omnirip-linux-x86_64
            binary_name: dist/omnirip
          - os: windows-latest
            artifact_name: omnirip-windows-x64.exe
            binary_name: dist/omnirip.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project and PyInstaller
        run: |
          uv sync --all-extras
          uv pip install pyinstaller

      - name: Build standalone binary with PyInstaller
        run: |
          uv run pyinstaller packaging/omnirip.spec

      - name: Rename binary for distribution
        shell: bash
        run: |
          mv ${{ matrix.binary_name }} dist/${{ matrix.artifact_name }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  publish-github-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts

      - name: Create GitHub Release with Standalone Executables
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
