name: Release Standalone Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-release:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: omnirip-macos-arm64.tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            artifact_name: omnirip-macos-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: omnirip-windows-x64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: omnirip-linux-x86_64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install ALSA headers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package artifacts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/bundle
          cp "target/${{ matrix.target }}/release/omnirip" dist/bundle/
          # One universal driver (arm64 + x86_64): both macOS archives carry a plug-in that loads.
          make -C drivers/omnirip_hal
          cp -R drivers/omnirip_hal/OmniRipAudio.driver dist/bundle/
          cp scripts/install.sh scripts/install.command README.md dist/bundle/
          tar -czf "dist/${{ matrix.artifact_name }}" -C dist/bundle .

      - name: Package artifacts (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/bundle
          cp "target/${{ matrix.target }}/release/omnirip" dist/bundle/
          cp scripts/install.sh README.md dist/bundle/
          tar -czf "dist/${{ matrix.artifact_name }}" -C dist/bundle .

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/omnirip.exe", "scripts/install.ps1", "README.md" -DestinationPath "dist/${{ matrix.artifact_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  publish:
    name: Publish signed release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts
          merge-multiple: true

      - name: Write SHA256SUMS and sign it
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "MINISIGN_SECRET_KEY is not set. Refusing to publish a release the updater cannot verify." >&2
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y minisign
          cd release_artifacts
          sha256sum omnirip-* > SHA256SUMS
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          minisign -S -s "$RUNNER_TEMP/minisign.key" -m SHA256SUMS -x SHA256SUMS.minisig -t "OmniRip ${GITHUB_REF_NAME}"
          rm -f "$RUNNER_TEMP/minisign.key"
          cat SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_artifacts/omnirip-*
            release_artifacts/SHA256SUMS
            release_artifacts/SHA256SUMS.minisig
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
