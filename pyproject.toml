[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harvester"
version = "0.1.0"
description = "OmniRip: async P2P-first music acquisition and curation TUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "einops>=0.8.2",
  "httpx>=0.27",
  "mutagen>=1.47",
  "numpy>=1.26",
  "platformdirs>=4.2",
  "textual>=0.50",
  "yt-dlp>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "pytest-httpserver>=1.0",
  "ruff>=0.6",
  "scipy>=1.12",
  "soundfile>=0.12",
]
restore = [
  "beartype>=0.18",
  "demucs>=4.0.0",
  "huggingface_hub>=0.20",
  "rotary_embedding_torch>=0.6",
  "torch>=2.2",
  "torchaudio>=2.2",
  "torchvision>=0.17",
  "transformers>=4.40",
]
diarize = [
  "pyannote.audio>=4.0",
]
# FlashSR runs the upstream inference code from a managed HF snapshot (the
# redistribution's packaging misses the namespace subpackages, so it is not
# pip-installable as-is). The extra carries the runtime deps that code needs.
flashsr = [
  "librosa>=0.10",
  "matplotlib>=3.8",
  "psutil>=5.9",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.scripts]
harvester = "harvester.__main__:main"
OmniRip = "harvester.__main__:main"
omnirip = "harvester.__main__:main"
omnirip-vision = "harvester.ui.full_vision:main"


[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pyrefly]
python-interpreter-path = ".venv/bin/python"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
# Third-party code kept as close to upstream as possible (GPL-3.0 MSST).
extend-exclude = ["src/harvester/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.coverage.run]
source = ["harvester"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]
