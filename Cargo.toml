[package]
name = "omnirip"
version = "0.2.0"
edition = "2021"
authors = ["OmniRip Team"]
description = "Audiophile Studio System EQ & Mastering Engine in Rust"

[dependencies]
cpal = "0.15"
rtrb = "0.3"
rustfft = "6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
lofty = "0.21"
symphonia = { version = "0.5", features = ["all"] }
regex = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
